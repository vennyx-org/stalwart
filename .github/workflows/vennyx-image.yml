name: "Vennyx image build"

# Builds a linux/amd64-only Docker image of the Vennyx Stalwart fork and
# pushes it to GHCR under the vennyx-org namespace. This is deliberately
# separate from upstream's `ci.yml`/`Dockerfile.build`/`docker-bake.hcl`
# (which build multi-arch images incl. FoundationDB variants and publish to
# both GHCR + Docker Hub under stalwartlabs) — we only run on Vennyx's own
# x86_64 infra, so we reuse the repo's simpler top-level `Dockerfile`
# (chef -> builder -> debian-slim runtime) instead of the heavier
# multi-arch pipeline.
#
# Triggers: manual (workflow_dispatch) or push to vennyx/deploy.
# Image: ghcr.io/vennyx-org/stalwart:vennyx-<short-sha> and :vennyx-latest

on:
  push:
    branches: ["vennyx/deploy"]
  workflow_dispatch: {}

concurrency:
  group: vennyx-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vennyx-org/stalwart

jobs:
  build-and-push:
    name: Build & push linux/amd64 image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Compute short SHA
        id: vars
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: echo "short_sha=${COMMIT_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:vennyx-${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:vennyx-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
        run: |
          {
            echo "### Vennyx Stalwart image published"
            echo ""
            echo "- \`${REGISTRY}/${IMAGE_NAME}:vennyx-${SHORT_SHA}\`"
            echo "- \`${REGISTRY}/${IMAGE_NAME}:vennyx-latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
